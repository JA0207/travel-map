<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060b13">
<title>我的足迹 · 城市点亮地图</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#060b13;color:#e6edf6;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif}
#app{position:fixed;inset:0;display:flex;flex-direction:column}

#topbar{position:relative;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(180deg,#060b13 55%,rgba(6,11,19,0));}
#backBtn{width:34px;height:34px;flex:0 0 34px;border-radius:11px;border:1px solid #1e2c40;background:#131d2e;
  color:#cfe0f5;font-size:17px;display:none;align-items:center;justify-content:center;line-height:1}
#backBtn.show{display:flex}
#titles{flex:1;min-width:0}
#title{font-size:16px;font-weight:600;letter-spacing:.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#subtitle{font-size:11px;color:#6b8199;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#searchBtn{flex:0 0 auto;width:34px;height:34px;border-radius:11px;border:1px solid #1e2c40;background:#131d2e;
  color:#8fd6b4;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0}
#statBtn{flex:0 0 auto;padding:7px 10px;border-radius:11px;border:1px solid #1e2c40;background:#131d2e;
  color:#8fd6b4;font-size:11.5px;font-weight:600;white-space:nowrap}

#mapWrap{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0}
#loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;color:#7d93ab;font-size:13px;background:#060b13;z-index:5;transition:opacity .35s;text-align:center;padding:0 30px;line-height:1.6}
#loading.hide{opacity:0;pointer-events:none}
.spinner{width:30px;height:30px;border:2.5px solid #1e2c40;border-top-color:#22c55e;border-radius:50%;
  animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);
  background:rgba(19,29,46,.92);border:1px solid #1e2c40;border-radius:20px;padding:7px 15px;
  font-size:11.5px;color:#8ba3bb;white-space:nowrap;z-index:10;transition:opacity .3s}

#mask{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:30}
#mask.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:#101a29;border-radius:20px 20px 0 0;
  border-top:1px solid #1e2c40;transform:translateY(102%);transition:transform .3s cubic-bezier(.32,.72,0,1);
  max-height:84vh;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.5)}
#sheet.show{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:2px;background:#2a3b52;margin:9px auto 4px;flex:0 0 auto}
#sheetHead{display:flex;align-items:flex-start;gap:10px;padding:8px 18px 12px;flex:0 0 auto}
#sheetHead .info{flex:1;min-width:0}
#pName{font-size:18px;font-weight:700;letter-spacing:.3px}
#pSub{font-size:11.5px;color:#6b8199;margin-top:3px}
#pBadge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:6px;font-size:10px;
  background:#123322;color:#38d67a;border:1px solid #1c5138;vertical-align:middle}
#visitBtn{flex:0 0 auto;padding:9px 15px;border-radius:12px;border:none;font-size:13px;font-weight:700;
  background:#1b2940;color:#9db4cc;transition:.18s}
#visitBtn.on{background:#22c55e;color:#04220f}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px calc(env(safe-area-inset-bottom) + 22px)}
.sec{margin-top:14px}
.sec-label{font-size:11.5px;color:#6b8199;margin-bottom:7px;letter-spacing:.4px}
input[type=month],input[type=text],textarea{width:100%;background:#0c1522;border:1px solid #1e2c40;color:#e6edf6;
  border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;outline:none}
input:focus,textarea:focus{border-color:#2f6b4c}
textarea{resize:none;min-height:66px;line-height:1.5}
#photoGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#0c1522;border:1px solid #1e2c40}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .del{position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;background:rgba(0,0,0,.72);
  color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;line-height:1}
.ph.add{display:flex;align-items:center;justify-content:center;font-size:24px;color:#3f5a76;
  border:1px dashed #2a3b52;background:#0c1522}
#subsList{margin-top:6px}
.subItem{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#0c1522;border:1px solid #1e2c40;
  border-radius:11px;margin-bottom:7px;font-size:13.5px}
.subItem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.subItem .dt{font-size:11px;color:#6b8199}
.subItem .x{color:#4d6480;font-size:15px;padding:0 3px}
.addSub{display:flex;gap:8px;margin-top:8px}
.addSub input{flex:1}
.addSub button{padding:0 15px;border-radius:11px;border:none;background:#1b2940;color:#9db4cc;font-size:13px;font-weight:600}
.enterBtn{width:100%;padding:12px;border-radius:12px;border:1px solid #23507a;
  background:#0e2138;color:#63b3ed;font-size:14px;font-weight:600}
.subNote{font-size:11.5px;color:#5b7189;margin-top:8px;line-height:1.6}

#stats{position:fixed;inset:0;z-index:40;background:#060b13;display:none;
  flex-direction:column;padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 20px)}
#stats.show{display:flex}
#stats h3{margin:0 0 4px;font-size:17px}
#stats .close{align-self:flex-end;font-size:13px;color:#6b8199;padding:6px 0 14px}
.statGrid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:8px}
.statCard{background:#101a29;border:1px solid #1e2c40;border-radius:14px;padding:15px}
.statCard .n{font-size:26px;font-weight:800;color:#22c55e;line-height:1.1}
.statCard .l{font-size:11.5px;color:#6b8199;margin-top:5px}
.statList{margin-top:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.tag{display:inline-block;padding:5px 10px;margin:0 6px 6px 0;background:#131d2e;border:1px solid #1e2c40;
  border-radius:9px;font-size:12.5px;color:#a8bdd3}
.statActions{display:flex;gap:9px;margin-top:12px;flex:0 0 auto}
.statActions button{flex:1;padding:12px;border-radius:12px;border:1px solid #1e2c40;background:#131d2e;
  color:#8ba3bb;font-size:13px;font-weight:600}

#search{position:fixed;inset:0;z-index:45;background:#060b13;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 12px) 0 0}
#search.show{display:flex}
.sbar{display:flex;align-items:center;gap:10px;padding:0 16px 12px;flex:0 0 auto}
#sInput{flex:1;background:#0f1a29;border:1px solid #24374e;border-radius:12px;padding:11px 13px;
  color:#e6edf6;font-size:15px;outline:none;font-family:inherit}
#sInput:focus{border-color:#2f6b4c}
#sClose{font-size:14px;color:#7d93ab;padding:6px 2px;flex:0 0 auto}
#sList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px calc(env(safe-area-inset-bottom) + 20px)}
.sr{display:flex;align-items:center;gap:10px;padding:13px 2px;border-bottom:1px solid #131f2e}
.sr:active{background:#0d1726}
.sr .nm{font-size:15px;flex:0 0 auto;color:#e6edf6}
.sr .meta{font-size:11.5px;color:#5b7189;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.sr .dot{width:7px;height:7px;border-radius:50%;background:#22c55e;flex:0 0 auto}
.sr .dot.off{background:#22334a}
.sEmpty{color:#4d6480;font-size:13px;padding:26px 0;text-align:center}
.sHint{color:#4d6480;font-size:12.5px;padding:16px 2px;line-height:1.7}
#gate{position:fixed;inset:0;background:#060b13;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
#gate.hide{display:none}
.gatebox{width:100%;max-width:320px;text-align:center}
.gtitle{font-size:23px;font-weight:800;color:#e6edf6;letter-spacing:3px;margin-bottom:8px}
.gsub{font-size:12.5px;color:#5b7189;margin-bottom:26px}
#gatePwd{width:100%;background:#0f1a29;border:1px solid #24374e;border-radius:12px;padding:13px;color:#e6edf6;font-size:16px;outline:none;text-align:center;letter-spacing:3px;font-family:inherit}
#gatePwd:focus{border-color:#2f6b4c}
#gateBtn{width:100%;margin-top:14px;padding:13px;border-radius:12px;border:none;background:#22c55e;color:#04220f;font-size:15px;font-weight:700;font-family:inherit}
#gateErr{height:18px;margin-top:10px;font-size:12.5px;color:#ef6b6b}
#syncDot{font-size:10px;color:#3d5a75;flex:0 0 auto}
</style>
</head>
<body>
<div id="gate">
  <div class="gatebox">
    <div class="gtitle">我的足迹</div>
    <div class="gsub">请输入访问密码</div>
    <input id="gatePwd" type="password" inputmode="text" placeholder="密码">
    <button id="gateBtn">进入</button>
    <div id="gateErr"></div>
  </div>
</div>
<div id="app">
  <div id="topbar">
    <button id="backBtn">‹</button>
    <div id="titles">
      <div id="title">世界足迹</div>
      <div id="subtitle">点国家/地区点亮你的足迹</div>
    </div>
    <button id="searchBtn">🔍</button>
    <span style="font-size:10px;color:#3d5a75;flex:0 0 auto">v3.4</span>
    <span id="syncDot">☁</span>
    <button id="statBtn">统计</button>
    <button id="clearProv" style="display:none;font-size:11px;padding:5px 8px">清空本省</button>
  </div>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="loading"><div class="spinner"></div><div id="loadingText">正在加载地图…</div></div>
    <div id="verToast" style="position:absolute;right:10px;bottom:12px;background:rgba(31,157,94,.92);color:#04220f;font-size:11px;font-weight:700;padding:4px 9px;border-radius:9px;z-index:30;pointer-events:none;transition:opacity .5s">v2.7 · 省界已内置</div>
    <div id="hint">点击地图上的国家点亮 · 双指缩放</div>
  </div>
</div>

<div id="mask"></div>
<div id="sheet">
  <div class="grab"></div>
  <div id="sheetHead">
    <div class="info">
      <div id="pName">—</div>
      <div id="pSub"></div>
    </div>
    <button id="visitBtn">标记去过</button>
  </div>
  <div id="sheetBody">
    <div class="sec" id="enterWrap" style="display:none">
      <button class="enterBtn" id="enterBtn">查看下级地图 ›</button>
    </div>
    <div class="sec">
      <div class="sec-label">时间</div>
      <input type="month" id="pDate">
    </div>
    <div class="sec">
      <div class="sec-label">备注</div>
      <textarea id="pNote" placeholder="在这里记下一点回忆…"></textarea>
    </div>
    <div class="sec">
      <div class="sec-label">照片</div>
      <div id="photoGrid"></div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
    </div>
    <div class="sec" id="subsWrap" style="display:none">
      <div class="sec-label">到过的省 / 州</div>
      <div id="subsList"></div>
      <div class="addSub">
        <input type="text" id="subInput" placeholder="如：California / 安大略省">
        <button id="subAdd">添加</button>
      </div>
      <div class="subNote" id="subNote"></div>
    </div>
  </div>
</div>

<div id="search">
  <div class="sbar">
    <input id="sInput" placeholder="搜国家 / 省份 / 城市，如 日本、西安">
    <span id="sClose">取消</span>
  </div>
  <div id="sList"></div>
</div>

<div id="stats">
  <div class="close" id="statsClose">关闭 ✕</div>
  <h3>我的足迹</h3>
  <div id="statsSub" style="font-size:11.5px;color:#6b8199"></div>
  <div class="statGrid" id="statGrid"></div>
  <div class="statList" id="statList"></div>
  <div class="statActions">
    <button id="exportBtn">导出备份</button>
    <button id="importBtn">导入备份</button>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </div>
</div>

<script src="vendor/aipexbase.umd.min.js"></script>

/* ========== 4. 存储层 ========== */
const DB_NAME = 'travel_map_db', STORE = 'places';
let db = null;
function openDB() {
  return new Promise(function (res, rej) {
    var rq = indexedDB.open(DB_NAME, 1);
    rq.onupgradeneeded = function (e) {
      var d = e.target.result;
      if (!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE, { keyPath: 'id' });
    };
    rq.onsuccess = function (e) { db = e.target.result; res(db); };
    rq.onerror = function (e) { rej(e.target.error); };
  });
}
function dbGet(id) {
  return new Promise(function (res) {
    var rq = db.transaction(STORE, 'readonly').objectStore(STORE).get(id);
    rq.onsuccess = function () { res(rq.result || null); };
    rq.onerror = function () { res(null); };
  });
}
function dbAll() {
  return new Promise(function (res) {
    var rq = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    rq.onsuccess = function () { res(rq.result || []); };
    rq.onerror = function () { res([]); };
  });
}
function dbPut(obj) {
  return new Promise(function (res) {
    var tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(obj);
    tx.oncomplete = function () { res(true); };
    tx.onerror = function () { res(false); };
  });
}
function dbDel(id) {
  return new Promise(function (res) {
    var tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).delete(id);
    tx.oncomplete = function () { res(true); };
  });
}

/* ========== 5. 状态 ========== */
const state = {
  view: { level: 'world' },
  visited: new Map(),
  current: null,
  maps: {}
};
const el = function (id) { return document.getElementById(id); };

function shortName(n) {
  return (n || '').replace(/(维吾尔自治区|壮族自治区|回族自治区|特别行政区|自治区|省|市|地区|盟)$/, '');
}
function esc(s) {
  return String(s).replace(/[&<>"]/g, function (m) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[m]; });
}

/* 城市 -> 省份 映射 */
const CITY_PARENT = {};
CN_CITY.forEach(function (c) { CITY_PARENT[c[1]] = c[2]; });

/* ========== 6. 点亮聚合 ========== */
function litIndex() {
  var s = { country: {}, prov: {}, city: {}, fstate: {} };
  state.visited.forEach(function (v, id) {
    if (!v.visited) return;
    if (id.indexOf('CN-P:') === 0) s.prov[id.slice(5)] = 1;
    else if (id.indexOf('CN-C:') === 0) { var a = id.slice(5); if (/^\d+$/.test(a)) s.city[a] = 1; }
    else if (id.indexOf('F:') === 0) s.fstate[id] = 1;
    else if (id.indexOf('W:') === 0) s.country[id.slice(2)] = 1;
  });
  return s;
}
/* 省份是否点亮：省本身 或 其下任一城市 */
function provLit(idx, adcode) {
  if (idx.prov[adcode]) return true;
  for (var c in idx.city) {
    if (CITY_PARENT[c] == adcode) return true;
  }
  return false;
}
/* 国家本身是否标记去过 */
function countrySelf(idx, en) {
  return !!idx.country[en];
}
/* 国家是否有下级记录（中国省/市，或海外省/州） */
function countryHasSub(idx, en) {
  if (en === 'China') {
    for (var p in idx.prov) return true;
    for (var c in idx.city) return true;
    return false;
  }
  var prefix = 'F:' + en + ':';
  for (var k in idx.fstate) {
    if (k.indexOf(prefix) === 0) return true;
  }
  return false;
}
/* 国家是否点亮：国家本身 或 中国有省/市 或 该国有海外省记录 */
function countryLit(idx, en) {
  return countrySelf(idx, en) || countryHasSub(idx, en);
}

  var fs = [];
  WORLD_GEO.features.forEach(function (f) {
    if (!f.properties || !f.properties.name) return;
    fs.push({ type: 'Feature', properties: { name: f.properties.name }, geometry: f.geometry });
  });
  CN_GEO.features.forEach(function (f) {
    fs.push({
      type: 'Feature',
      properties: { name: 'CN·' + f.properties.name, adcode: f.properties.adcode, isCnProv: 1 },
      geometry: f.geometry
    });
  });
  subFeats.forEach(function (f) { fs.push(f); });
  WORLD_FULL = { type: 'FeatureCollection', features: fs };
  WORLD_FULL_KEY = key;
  return WORLD_FULL;
}

/* ========== 8. 渲染 ========== */
let chart = null;
let lastZoom = null;
let roamLock = false;

const GREEN = { areaColor: '#1f9d5e', borderColor: '#5ef2a3', borderWidth: 1.1 };
/* 低亮：仅下级去过、国家/省份本身未标记 */
const GREEN_SOFT = { areaColor: '#15573b', borderColor: '#2f8f63', borderWidth: 0.9 };
/* 更低亮：同级里有别处点亮，但这里没去过 */
const GREEN_DIM = { areaColor: '#0e3527', borderColor: '#1f6b4a', borderWidth: 0.8 };

function buildWorldData(subFeats) {
  subFeats = subFeats || [];
  var idx = litIndex();
  var out = [];
  WORLD_GEO.features.forEach(function (f) {
    var en = f.properties.name;
    var self = countrySelf(idx, en);
    var hasSub = countryHasSub(idx, en);
    if (self) out.push({ name: en, __on: true, itemStyle: GREEN });
    else if (hasSub) out.push({ name: en, __on: false, __sub: true, itemStyle: GREEN_SOFT });
    else out.push({ name: en, __on: false });
  });
  var cnSelf = countrySelf(idx, 'China');
  var cnSub = countryHasSub(idx, 'China');
  CN_GEO.features.forEach(function (f) {
    var p = f.properties;
    var on = provLit(idx, p.adcode);
    if (on) out.push({ name: 'CN·' + p.name, __on: true, itemStyle: GREEN });
    else if (cnSelf || cnSub) out.push({ name: 'CN·' + p.name, __on: false, itemStyle: GREEN_DIM });
    else out.push({ name: 'CN·' + p.name, __on: false });
  });
  /* 海外省/州图层：点亮的省高亮，其余低亮 */
  subFeats.forEach(function (f) {
    var p = f.properties;
    var en = p.__country;
    var self = countrySelf(idx, en);
    var on = self || !!idx.fstate['F:' + en + ':' + p.__state];
    if (on) out.push({ name: p.name, __on: true, itemStyle: GREEN });
    else out.push({ name: p.name, __on: false, itemStyle: GREEN_DIM });
  });
  return out;
}
function buildCNData(subFeats) {
  subFeats = subFeats || [];
  var idx = litIndex();
  var out = CN_GEO.features.map(function (f) {
    var p = f.properties;
    var self = !!idx.prov[p.adcode];
    var hasCity = false;
    for (var c in idx.city) { if (CITY_PARENT[c] == p.adcode) { hasCity = true; break; } }
    if (self) return { name: p.name, __on: true, itemStyle: GREEN };
    if (hasCity) return {
      name: p.name, __on: false, __sub: true,
      itemStyle: { areaColor: '#0f2a22', borderColor: '#2f9e6b', borderWidth: 1.6 }
    };
    return { name: p.name, __on: false };
  });
  /* 已有点亮城市的省份：叠加市级图层，只亮去过的市 */
  subFeats.forEach(function (f) {
    var p = f.properties;
    var on = !!idx.city[p.__cityAdcode];
    out.push({
      name: p.name, __on: on, __city: true,
      label: { show: false },
      itemStyle: on ? GREEN : { areaColor: '#0f2a22', borderColor: '#243549', borderWidth: 0.7 }
    });
  });
  return out;
}
function buildCityData(adcode) {
  var geo = state.maps['cn-' + adcode];
  if (!geo) return [];
  var idx = litIndex();
  return geo.features.map(function (f) {
    var p = f.properties;
    var on = !!idx.city[p.adcode];
    return on
      ? { name: p.name, __on: true, itemStyle: { areaColor: '#1f9d5e', borderColor: '#7dffb8', borderWidth: 1.4 } }
      : { name: p.name, __on: false, itemStyle: { areaColor: '#111c2a', borderColor: '#243549', borderWidth: 0.7 } };
  });
}
function buildForeignData(iso2) {
  var geo = state.maps['f-' + iso2];
  if (!geo) return [];
  var idx = litIndex();
  var prefix = 'F:' + state.view.country.en + ':';
  return geo.features.map(function (f) {
    var nm = f.properties.name;
    var on = !!idx.fstate[prefix + nm];
    return on ? { name: nm, __on: true, itemStyle: GREEN } : { name: nm, __on: false };
  });
}

function baseOption(mapName, level, data, extra) {
  extra = extra || {};
  return {
    backgroundColor: 'transparent',
    animationDuration: 380,
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(16,26,41,.96)',
      borderColor: '#24374e',
      borderWidth: 1,
      padding: [7, 11],
      textStyle: { color: '#dbe7f5', fontSize: 12 },
      formatter: function (p) {
        if (!p.name) return '';
        var nm = String(p.name).replace(/^CN·/, '').replace(/^F·[^·]+·/, '').replace(/^CITY·[^·]+·/, '');
        return nm + (p.data && p.data.__on ? '  <span style="color:#22c55e">✓ 去过</span>' : (p.data && p.data.__sub ? '  <span style="color:#5f8f79">有足迹</span>' : ''));
      }
    },
    series: [{
      type: 'map',
      map: mapName,
      roam: true,
      scaleLimit: { min: 0.8, max: 14 },
      zoom: extra.zoom || 1,
      boundingCoords: extra.boundingCoords,
      selectedMode: false,
      label: {
        show: level !== 'world',
        color: '#93aac3',
        fontSize: 9.5,
        formatter: function (p) { return shortName(p.name); }
      },
      itemStyle: {
        areaColor: level === 'city' ? '#18273a' : '#22334a',
        borderColor: '#4a6c92',
        borderWidth: level === 'city' ? 0.7 : 1
      },
      emphasis: {
        label: { show: true, color: '#fff', fontSize: 11.5, fontWeight: 'bold' },
        itemStyle: { areaColor: '#31608f', borderColor: '#8cc9f5', borderWidth: 1.5 }
      },
      data: data
    }]
  };
}

let renderSeq = 0;
async function renderMap() {
  var mySeq = ++renderSeq;
  var v = state.view;
  var mapName, title, sub, extra = {};
  var subFeats = [];

  if (v.level === 'world') {
    mapName = 'world-full';
    title = '世界足迹';
    sub = '点国家/地区点亮 · 中国/已去国家可看到省份';
    extra.zoom = 1.05;
    extra.boundingCoords = [[-180, 84], [180, -58]];
    subFeats = [];
    var needSub = false;
    for (var kk in litIndex().fstate) { needSub = true; break; }
    if (needSub) { el('subtitle').textContent = '正在加载省界…'; }
    var r = await loadWorldSubs();
    subFeats = r.feats;
    if (mySeq !== renderSeq) return;
    if (r.fail) sub = '省界加载失败（' + r.fail + ' 个国家）· 请检查网络后重试';
    var geoObj = worldFull(subFeats);
    if (state.maps['world-full'] !== WORLD_FULL_KEY) {
      echarts.registerMap('world-full', geoObj);
      state.maps['world-full'] = WORLD_FULL_KEY;
    }
  } else if (v.level === 'cn') {
    mapName = 'cn-full';
    title = '中国足迹';
    sub = '点省份点亮 · 点开省份看城市';
    extra.zoom = 1.05;
    var cnCityFeats = await loadCNCityFeats();
    if (mySeq !== renderSeq) return;
    var cnGeo = cnFull(cnCityFeats);
    if (state.maps['cn-full'] !== CN_FULL_KEY) {
      echarts.registerMap('cn-full', cnGeo);
      state.maps['cn-full'] = CN_FULL_KEY;
    }
  } else if (v.level === 'city') {
    mapName = 'cn-' + v.cn.adcode;
    title = shortName(v.cn.name) + ' · 城市';
    var cnt = countCityLit(v.cn.adcode);
    sub = cnt.on
      ? ('已点亮：' + cnt.names.join('、') + '　（' + cnt.on + '/' + cnt.total + '）')
      : ('点亮 0 / ' + cnt.total + ' 个城市 · 点城市切换去过状态');
    extra.zoom = 1.05;
  } else {
    mapName = 'f-' + v.country.iso2;
    title = v.country.name + ' · 省/州';
    var cf = countForeignLit(v.country.en);
    sub = '点亮 ' + cf.on + ' / ' + cf.total + ' 个省/州 · 点省州切换去过状态';
    extra.zoom = 1.05;
  }

  el('title').textContent = title;
  el('subtitle').textContent = sub;
  el('clearProv').style.display = (v.level === 'city' && countCityLit(v.cn.adcode).on > 0) ? 'block' : 'none';
  el('backBtn').classList.toggle('show', v.level !== 'world');

  var data = v.level === 'world' ? buildWorldData(subFeats)
    : v.level === 'cn' ? buildCNData(cnCityFeats)
      : v.level === 'city' ? buildCityData(v.cn.adcode)
        : buildForeignData(v.country.iso2);

  chart.setOption(baseOption(mapName, v.level, data, extra), true);
  lastZoom = extra.zoom || 1;
  bindRoamDamping();
}

function countCityLit(adcode) {
  var geo = state.maps['cn-' + adcode];
  var idx = litIndex();
  if (!geo) return { on: 0, total: 0, names: [] };
  var on = 0, total = 0, names = [];
  geo.features.forEach(function (f) {
    total++;
    if (idx.city[f.properties.adcode]) { on++; names.push(shortName(f.properties.name)); }
  });
  return { on: on, total: total, names: names };
}
function countForeignLit(en) {
  var geo = state.maps['f-' + (ISO2[en] || '')];
  var idx = litIndex();
  if (!geo) return { on: 0, total: 0 };
  var prefix = 'F:' + en + ':';
  var on = 0, total = 0;
  geo.features.forEach(function (f) {
    total++;
    if (idx.fstate[prefix + f.properties.name]) on++;
  });
  return { on: on, total: total };
}

/* 世界地图：加载所有已记录海外省/州所在国家的省级边界 */
const FSUB_FEATS = {};
async function ensureForeignStates(iso2, en) {
  var ck = iso2 + '|' + en;
  if (FSUB_FEATS[ck]) return FSUB_FEATS[ck];
  var geo = await ensureForeign(iso2);
  var feats = [];
  (geo.features || []).forEach(function (f) {
    var p = f.properties || {};
    var hk = p['hc-key'];
    if (hk && hk.split('-').length > 2) return; /* 只保留一级行政区 */
    if (!p.name) return;
    feats.push({
      type: 'Feature',
      properties: { name: 'F·' + en + '·' + p.name, __country: en, __state: p.name },
      geometry: f.geometry
    });
  });
  FSUB_FEATS[ck] = feats;
  return feats;
}
async function loadWorldSubs() {
  var idx = litIndex();
  var names = {};
  for (var k in idx.fstate) {
    var p = k.split(':');
    if (p.length >= 3 && p[1]) names[p[1]] = 1;
  }
  var list = Object.keys(names);
  var out = [];
  var fail = 0;
  await Promise.all(list.map(async function (en) {
    var iso2 = ISO2[en];
    if (!iso2) { fail++; return; }
    try {
      var fs = await ensureForeignStates(iso2, en);
      fs.forEach(function (f) { out.push(f); });
    } catch (e) { fail++; }
  }));
  return { feats: out, fail: fail };
}

/* 缩放阻尼：让双指/滚轮缩放变慢 */
function bindRoamDamping() {
  if (!chart) return;
  chart.off('georoam');
  chart.on('georoam', function () {
    if (roamLock) return;
    var opt = chart.getOption();
    var s = opt.series && opt.series[0];
    if (!s || s.zoom == null) return;
    var z = s.zoom;
    if (lastZoom == null) { lastZoom = z; return; }
    var ratio = z / lastZoom;
    if (Math.abs(ratio - 1) < 0.003) { lastZoom = z; return; }
    var target = lastZoom * Math.pow(ratio, 0.38);
    lastZoom = target;
    roamLock = true;
    chart.setOption({ series: [{ zoom: target }] }, { lazyUpdate: true });
    setTimeout(function () { roamLock = false; }, 16);
  });
}

/* ========== 9. 地图注册 ========== */
function registerWorld() {
  if (state.maps['world-full']) return;
  echarts.registerMap('world-full', worldFull());
  state.maps['world-full'] = 1;
}
function registerCN() {
  if (state.maps['cn']) return;
  echarts.registerMap('cn', CN_GEO);
  state.maps['cn'] = CN_GEO;
}
async function ensureCity(adcode) {
  var key = 'cn-' + adcode;
  if (state.maps[key]) return state.maps[key];
  var geo = await fetchJSON([
    'https://geo.datav.aliyun.com/areas_v3/bound/' + adcode + '_full.json',
    'https://geojson.cn/api/china/' + adcode + '.json'
  ]);
  if (!geo || !geo.features || !geo.features.length) throw new Error('empty');
  /* 规范化：不同数据源的字段不一致（datav 用 adcode/name，geojson.cn 用 code/fullname） */
  geo.features.forEach(function (f) {
    var p = f.properties || (f.properties = {});
    var nm = String(p.name || p.fullname || '');
    var full = (p.fullname && String(p.fullname).length >= nm.length) ? String(p.fullname) : nm;
    var code = p.adcode != null ? p.adcode : (p.code != null ? +p.code : null);
    if (code == null) {
      var hit = CN_CITY.find(function (c) {
        return (c[0] === full || c[0] === nm) && CITY_PARENT[c[1]] == adcode;
      });
      if (hit) code = hit[1];
    }
    p.adcode = code;
    p.name = full || nm;
  });
  echarts.registerMap(key, geo);
  state.maps[key] = geo;
  return geo;
}

/* 中国地图：叠加已点亮城市所在省的市级图层 */
let CN_FULL = null;
let CN_FULL_KEY = '';
function cnFull(cityFeats) {
  cityFeats = cityFeats || [];
  var key = cityFeats.map(function (f) { return f.properties.name; }).join('|');
  if (CN_FULL && CN_FULL_KEY === key) return CN_FULL;
  var fs = CN_GEO.features.map(function (f) {
    return { type: 'Feature', properties: { name: f.properties.name, adcode: f.properties.adcode }, geometry: f.geometry };
  });
  cityFeats.forEach(function (f) { fs.push(f); });
  CN_FULL = { type: 'FeatureCollection', features: fs };
  CN_FULL_KEY = key;
  return CN_FULL;
}
async function loadCNCityFeats() {
  var idx = litIndex();
  var provs = {};
  for (var c in idx.city) {
    var p = CITY_PARENT[c];
    if (p) provs[p] = 1;
  }
  var out = [];
  await Promise.all(Object.keys(provs).map(async function (ad) {
    try {
      var geo = await ensureCity(ad);
      (geo.features || []).forEach(function (f) {
        var pr = f.properties || {};
        if (!pr.name || pr.adcode == null) return;
        out.push({
          type: 'Feature',
          properties: {
            name: 'CITY·' + ad + '·' + pr.name,
            __adcode: +ad, __cityAdcode: pr.adcode, __cityName: pr.name
          },
          geometry: f.geometry
        });
      });
    } catch (e) { }
  }));
  return out;
}
async function ensureForeign(iso2) {
  var key = 'f-' + iso2;
  if (state.maps[key]) return state.maps[key];
  var geo = await fetchJSON([
    './maps/' + iso2 + '.json',
    'https://fastly.jsdelivr.net/npm/@highcharts/map-collection@2.0.1/countries/' + iso2 + '/' + iso2 + '-all.geo.json',
    'https://cdn.jsdelivr.net/npm/@highcharts/map-collection@2.0.1/countries/' + iso2 + '/' + iso2 + '-all.geo.json'
  ]);
  var all = (geo.features || []).filter(function (f) {
    return f.geometry && f.properties && f.properties.name;
  });
  var fs = all.filter(function (f) {
    var hk = f.properties['hc-key'];
    if (hk && hk.split('-').length > 2) return false; /* 只保留一级行政区（省/州） */
    return true;
  });
  if (!fs.length) fs = all;
  if (!fs.length) throw new Error('empty');
  var clean = { type: 'FeatureCollection', features: fs };
  echarts.registerMap(key, clean);
  state.maps[key] = clean;
  return clean;
}

/* ========== 10. 点击 ========== */
function onMapClick(params) {
  var v = state.view;
  if (!params.name) return;
  var nm = String(params.name);

  if (v.level === 'world') {
    if (nm.indexOf('CN·') === 0) {
      var pname = nm.slice(3);
      var f = CN_GEO.features.find(function (x) { return x.properties.name === pname; });
      if (!f) return;
      var p = f.properties;
      openPlace({
        id: 'CN-P:' + p.adcode, name: p.name, adcode: p.adcode,
        type: 'province', fromWorld: true, canEnter: true
      });
      return;
    }
    if (nm.indexOf('F·') === 0) {
      var rest = nm.slice(2);
      var idxSep = rest.indexOf('·');
      if (idxSep > 0) {
        var cen = rest.slice(0, idxSep), st = rest.slice(idxSep + 1);
        openPlace({
          id: 'F:' + cen + ':' + st, name: st, type: 'fstate',
          parent: { name: zh(cen), en: cen }, canEnter: false
        });
        return;
      }
    }
    var en = nm;
    openPlace({
      id: 'W:' + en, name: zh(en), en: en, type: 'country',
      canEnter: en === 'China', iso2: ISO2[en] || ''
    });
  } else if (v.level === 'cn') {
    if (nm.indexOf('CITY·') === 0) {
      var rest = nm.slice(5);
      var sep = rest.indexOf('·');
      if (sep > 0) {
        var pad = +rest.slice(0, sep), cname = rest.slice(sep + 1);
        var cgeo = state.maps['cn-' + pad];
        var cf = cgeo && cgeo.features.find(function (x) { return x.properties.name === cname; });
        if (!cf) return;
        var pf = CN_GEO.features.find(function (x) { return x.properties.adcode == pad; });
        openPlace({
          id: 'CN-C:' + cf.properties.adcode, name: cname, adcode: cf.properties.adcode,
          type: 'city', parent: { adcode: +pad, name: pf ? pf.properties.name : '' }, canEnter: false
        });
        return;
      }
    }
    var f2 = CN_GEO.features.find(function (x) { return x.properties.name === nm; });
    if (!f2) return;
    var p2 = f2.properties;
    openPlace({
      id: 'CN-P:' + p2.adcode, name: p2.name, adcode: p2.adcode,
      type: 'province', canEnter: (p2.childrenNum || 0) > 0 || true
    });
  } else if (v.level === 'city') {
    var geo = state.maps['cn-' + v.cn.adcode];
    var f3 = geo && geo.features.find(function (x) { return x.properties.name === nm; });
    if (!f3) return;
    var p3 = f3.properties;
    openPlace({
      id: 'CN-C:' + p3.adcode, name: p3.name, adcode: p3.adcode,
      type: 'city', parent: v.cn, canEnter: false
    });
  } else {
    openPlace({
      id: 'F:' + v.country.en + ':' + nm, name: nm, type: 'fstate',
      parent: v.country, canEnter: false
    });
  }
}

/* ========== 11. 详情面板 ========== */
async function openPlace(meta) {
  var rec = await dbGet(meta.id);
  state.current = Object.assign({}, meta, {
    visited: rec ? !!rec.visited : false,
    date: rec ? rec.date || '' : '',
    note: rec ? rec.note || '' : '',
    photos: rec ? rec.photos || [] : []
  });
  paintSheet();
  el('mask').classList.add('show');
  el('sheet').classList.add('show');
}
function closeSheet() {
  el('mask').classList.remove('show');
  el('sheet').classList.remove('show');
  state.current = null;
}

var TYPE_LABEL = {
  country: '国家 / 地区',
  province: '中国 · 省份',
  city: '中国 · 城市',
  fstate: '省 / 州'
};

function paintSheet() {
  var c = state.current;
  if (!c) return;
  el('pName').textContent = c.name;
  var sub = TYPE_LABEL[c.type] || '';
  if (c.type === 'city' && c.parent) sub = shortName(c.parent.name) + ' · 城市';
  if (c.type === 'fstate' && c.parent) sub = c.parent.name + ' · 省/州';
  if (c.visited) sub += '<span id="pBadge">✓ 已点亮</span>';
  el('pSub').innerHTML = sub;

  var btn = el('visitBtn');
  btn.textContent = c.visited ? '已点亮 ✓' : '标记去过';
  btn.classList.toggle('on', c.visited);

  el('pDate').value = c.date || '';
  el('pNote').value = c.note || '';
  paintPhotos();

  // 下级入口

  else if (c.type === 'country' && c.iso2) { showEnter = true; enterText = '查看省 / 州地图 ›'; }
  else if (c.type === 'province' && c.fromWorld) { showEnter = true; enterText = '进入中国地图 ›'; }
  else if (c.type === 'province') { showEnter = true; enterText = '查看城市地图 ›'; }
  else if (c.type === 'city' && c.parent && c.parent.adcode) { showEnter = true; enterText = '查看' + shortName(c.parent.name) + '城市地图 ›'; }
  el('enterWrap').style.display = showEnter ? 'block' : 'none';
  if (showEnter) el('enterBtn').textContent = enterText;

  el('subsWrap').style.display = showSubs ? 'block' : 'none';
  if (showSubs) { paintSubs(); }
}

function paintSubs() {
  var list = el('subsList');
  var c = state.current;
  var prefix = 'F:' + c.en + ':';
  var items = [];
  state.visited.forEach(function (v, id) {
    if (id.indexOf(prefix) === 0 && v.visited) items.push({ id: id, name: id.slice(prefix.length), date: v.date });
  });
  list.innerHTML = '';
  if (!items.length) {
    list.innerHTML = '<div style="font-size:12px;color:#4d6480;padding:2px 0 6px">还没有记录</div>';
  }
  items.forEach(function (it) {
    var d = document.createElement('div');
    d.className = 'subItem';
    d.innerHTML = '<span class="nm">' + esc(it.name) + '</span>' +

/* 图片解密显示（缓存 objectURL） */
var IMG_CACHE = {};
async function photoURL(ph, useThumb) {
  var src = useThumb ? (ph.thumb || ph.data) : (ph.data || ph.thumb);
  if (!src) return '';
  if (!PHOTO_KEY || src.indexOf('data:') === 0) return src;
  if (IMG_CACHE[src]) return IMG_CACHE[src];
  try {
    var u = await decryptToURL(PHOTO_KEY, src);
    IMG_CACHE[src] = u;
    return u;
  } catch (e) {
    return src; /* 旧版未加密照片，直接显示 */
  }
}

async function saveCurrent() {
  var c = state.current;
  if (!c) return;
  var obj = {
    id: c.id, name: c.name, en: c.en || '', adcode: c.adcode || null,
    type: c.type, iso2: c.iso2 || '',
    parentName: c.parent ? c.parent.name : '',
    visited: c.visited, date: c.date, note: c.note,
    photos: c.photos || [],
    updated: Date.now()
  };
  if (!obj.visited && !obj.note && !obj.photos.length) {
    await dbDel(c.id);
    state.visited.delete(c.id);
    cloudDel(c.id);
  } else {
    await dbPut(obj);
    state.visited.set(c.id, obj);
    cloudPush(obj);
  }
  renderMap();
  updateStatBadge();
}

/* ========== 12. 照片处理（原图上传 + 缩略图） ========== */
async function uploadFileRaw(file) {
  var body = file;
  var name = (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg';
  if (PHOTO_KEY) body = await encryptBlob(PHOTO_KEY, file);
  var fd = new FormData();
  fd.append('file', body, name);
  var r = await fetch(CLOUD.baseUrl + '/common/upload', { method: 'POST', headers: { 'CODE_FLYING': CLOUD.apiKey }, body: fd });
  var j = await r.json();
  if (j && j.success && j.data) return j.data.url;
  return null;
}
function makeThumb(file, maxSide, quality) {
  maxSide = maxSide || 520; quality = quality || 0.72;
  return new Promise(function (res) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        var r = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * r); h = Math.round(h * r);
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = function () { res(''); };
      img.src = fr.result;
    };
    fr.onerror = function () { res(''); };
    fr.readAsDataURL(file);
  });
}
function compress(file, maxSide, quality) {
  maxSide = maxSide || 1400; quality = quality || 0.82;
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var w = img.width, h = img.height;
        var r = Math.min(1, maxSide / Math.max(w, h));
        w = Math.round(w * r); h = Math.round(h * r);
        var cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        res(cv.toDataURL('image/jpeg', quality));
      };
      img.onerror = rej;
      img.src = fr.result;
    };
    fr.onerror = rej;
    fr.readAsDataURL(file);
  });
}

/* ========== 14. 搜索 ========== */
var SEARCH_IDX = null;
function buildIdx() {
  if (SEARCH_IDX) return SEARCH_IDX;
  var arr = [];
  for (var en in CN_NAME) arr.push({ n: CN_NAME[en], en: en, t: 'country' });
  CN_INDEX.prov.forEach(function (p) { arr.push({ n: p[0], a: p[1], t: 'province' }); });
  CN_CITY.forEach(function (c) { arr.push({ n: c[0], a: c[1], p: c[2], pn: c[3], t: 'city' }); });
  SEARCH_IDX = arr;
  return arr;
}
function typeLabel(it) {
  if (it.t === 'country') return '国家 / 地区';
  if (it.t === 'province') return '中国 · 省份';
  return shortName(it.pn) + ' · 城市';
}
function placeIdOf(it) {
  if (it.t === 'country') return 'W:' + it.en;
  if (it.t === 'province') return 'CN-P:' + it.a;
  return 'CN-C:' + it.a;
}
function runSearch(q) {
  var list = el('sList');
  q = (q || '').trim();
  if (!q) {
    list.innerHTML = '<div class="sHint">可以搜国家（日本 / Japan）、省份（陕西）、城市（西安）<br>搜到后点一下就能直接点亮</div>';
    return;
  }
  var ql = q.toLowerCase();
  var idx = buildIdx();
  var scored = [];
  for (var i = 0; i < idx.length; i++) {
    var it = idx[i], s = 0, nm = it.n, sn = shortName(nm);
    if (it.t === 'country') {
      var en = (it.en || '').toLowerCase();
      if (nm === q) s = 100; else if (nm.indexOf(q) === 0) s = 88;
      else if (nm.indexOf(q) >= 0) s = 66;
      else if (en === ql) s = 96; else if (en.indexOf(ql) === 0) s = 78;
      else if (en.indexOf(ql) >= 0) s = 56;
    } else {
      if (sn === q || nm === q) s = 100;
      else if (sn.indexOf(q) === 0) s = 86;
      else if (nm.indexOf(q) === 0) s = 82;
      else if (sn.indexOf(q) >= 0 || nm.indexOf(q) >= 0) s = 62;
      else if (it.pn && shortName(it.pn).indexOf(q) >= 0) s = 28;
    }
    if (s > 0) scored.push([s, it]);
  }
  scored.sort(function (a, b) { return b[0] - a[0]; });
  var top = scored.slice(0, 40);
  if (!top.length) { list.innerHTML = '<div class="sEmpty">没有找到「' + esc(q) + '」</div>'; return; }
  list.innerHTML = '';
  top.forEach(function (pair) {
    var it = pair[1];
    var id = placeIdOf(it);
    var rec = state.visited.get(id);
    var on = rec && rec.visited;
    var d = document.createElement('div');
    d.className = 'sr';
    d.innerHTML = '<span class="dot' + (on ? '' : ' off') + '"></span>' +
      '<span class="nm">' + esc(it.n) + '</span>' +
      '<span class="meta">' + esc(typeLabel(it)) + '</span>';
    d.onclick = function () { closeSearch(); pickResult(it); };
    list.appendChild(d);
  });
}
function pickResult(it) {
  if (it.t === 'country') openPlace({ id: 'W:' + it.en, name: it.n, en: it.en, type: 'country', canEnter: it.en === 'China', iso2: ISO2[it.en] || '' });
  else if (it.t === 'province') openPlace({ id: 'CN-P:' + it.a, name: it.n, adcode: it.a, type: 'province', canEnter: true });
  else openPlace({ id: 'CN-C:' + it.a, name: it.n, adcode: it.a, type: 'city', parent: { adcode: it.p, name: it.pn }, canEnter: false });
}

const CLOUD = { baseUrl: 'https://baas.kuafuai.net/baas-api', apiKey: 'baas_vBqYM8i3' };

/* ---- 照片加密（AES-GCM，密钥由访问密码派生） ---- */
async function deriveKey(pwd) {
  var enc = new TextEncoder();
  var base = await crypto.subtle.importKey('raw', enc.encode(pwd), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: enc.encode('travel-map-salt-v1'), iterations: 150000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
  );
}
async function encryptBlob(key, blob) {
  var iv = crypto.getRandomValues(new Uint8Array(12));
  var buf = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, await blob.arrayBuffer());
  return new Blob([iv, new Uint8Array(buf)], { type: 'application/octet-stream' });
}
async function decryptToURL(key, url) {
  var r = await fetch(url);
  if (!r.ok) throw new Error('fetch');
  var b = new Uint8Array(await r.arrayBuffer());
  if (b.length < 30) throw new Error('small');
  var iv = b.slice(0, 12), data = b.slice(12);
  var plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, data);
  return URL.createObjectURL(new Blob([plain], { type: 'image/jpeg' }));
}
async function keyToB64(key) {
  var raw = await crypto.subtle.exportKey('raw', key);
  return btoa(String.fromCharCode.apply(null, new Uint8Array(raw)));
}
async function keyFromB64(b64) {
  var raw = Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); });
  return crypto.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, ['encrypt', 'decrypt']);
}

function tsNow() {
  var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());

async function sha256(s) {
  var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
}

async function cloudPush(rec) {

      updated_at: tsNow()
    };
    var q = await client.db.from('places').list().eq('place_id', rec.id);
    if (q && q.success && q.data && q.data.length) {
      await client.db.from('places').update().set(body).eq('place_id', rec.id);
    } else {
      var ins = Object.assign({ place_id: rec.id }, body);
      await client.db.from('places').insert().values(ins);
    }
    syncState('☁ 已同步', '#22c55e');
  } catch (e) { syncState('☁ 离线', '#ef6b6b'); }
}
async function cloudDel(id) {
  if (!client) return;
  try { await client.db.from('places').delete().eq('place_id', id); } catch (e) { }
}
async function cloudPull() {
  if (!client) return;
  try {
    var r = await client.db.from('places').list();
    if (!r || !r.success || !r.data) { syncState('☁ 离线', '#ef6b6b'); return; }
    r.data.forEach(function (row) {
      if (!row.place_id) return;
      var photos = [];
      try {
        photos = (JSON.parse(row.photos_json || '[]') || []).map(function (it) {
          return typeof it === 'string' ? { data: it } : { data: it.u, thumb: it.t || '' };
        });
      } catch (e) { }
      var rec = {
        id: row.place_id, name: row.name, type: row.type,
        adcode: row.adcode ? +row.adcode : null, en: row.country_en || '',
        visited: !!row.visited, date: row.visit_date || '', note: row.note || '',
        photos: photos,
        updated: row.updated_at ? Date.parse(String(row.updated_at).replace(' ', 'T')) : 0
      };
      var local = state.visited.get(rec.id);
      if (!local || (rec.updated || 0) >= (local.updated || 0)) {
        state.visited.set(rec.id, rec);
        dbPut(rec);
      } else {
        cloudPush(local);
      }
    });
    syncState('☁ 已同步', '#22c55e');
  } catch (e) { syncState('☁ 离线', '#ef6b6b'); }
}

/* ========== 17. 启动 ========== */
function startApp() {
  initCloud();
  loadScript(ECHARTS_CDN).then(async function () {
    await openDB();
    var all = await dbAll();
    /* 清理无效 id（早期 fallback 数据源缺 adcode 时写入的 CN-C:undefined） */
    for (var qi = 0; qi < all.length; qi++) {
      var p0 = all[qi];
      if (p0 && typeof p0.id === 'string' && p0.id.indexOf('CN-C:') === 0 && !/^\d+$/.test(p0.id.slice(5))) {
        await dbDel(p0.id);
      } else if (p0) {
        state.visited.set(p0.id, p0);
      }
    }
    updateStatBadge();

    chart = echarts.init(el('map'), null, { renderer: 'canvas' });
    chart.on('click', onMapClick);
    window.addEventListener('resize', function () { if (chart) chart.resize(); });

    registerWorld();
    await cloudPull();
    renderMap();
    el('loading').classList.add('hide');
    setTimeout(function () { el('verToast').style.opacity = 0; }, 4000);
    setTimeout(function () { el('hint').style.opacity = 0; }, 5000);
    /* 首次迁移：本地有、云端无的记录推上去 */
    if (client) state.visited.forEach(function (v) { cloudPush(v); });
  }).catch(function () {
    el('loadingText').textContent = '图表库加载失败，请检查网络后刷新';
  });
}

(function boot() {
  bindUI();
  el('gateBtn').onclick = async function () {
    var v = el('gatePwd').value;
    var h = await sha256(v);
    if (h === PWD_HASH) {
      PHOTO_KEY = await deriveKey(v);
      try { localStorage.setItem('tm_key', await keyToB64(PHOTO_KEY)); localStorage.setItem('tm_keyv', PWD_HASH.slice(0, 8)); } catch (e) { }
      localStorage.setItem('tm_auth', '1');
      el('gate').classList.add('hide');
      startApp();
    } else {
      el('gateErr').textContent = '密码错误';
    }
  };
  el('gatePwd').addEventListener('keydown', function (e) { if (e.key === 'Enter') el('gateBtn').click(); });
  if (localStorage.getItem('tm_auth') === '1' && localStorage.getItem('tm_key')
      && localStorage.getItem('tm_keyv') === PWD_HASH.slice(0, 8)) {
    el('gate').classList.add('hide');
    (async function () {
      try {
        var k = localStorage.getItem('tm_key');
        PHOTO_KEY = await keyFromB64(k);
        startApp();
      } catch (e) {
        PHOTO_KEY = null;
        localStorage.removeItem('tm_auth');
        localStorage.removeItem('tm_key');
        el('gate').classList.remove('hide');
      }
    })();
  } else {
    localStorage.removeItem('tm_auth');
    localStorage.removeItem('tm_key');
  }
})();
</script>
